name: Runtime development snapshot
on:
  push:
    branches: [chatgpt/runtime-bringup]
    paths: [.github/workflows/runtime-dev-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: runtime-development-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive only integration source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/juice-source
          git archive e57347a66f00ff9af02c287e507ddaa79d4be183 app scripts config Makefile README.md patches launcher toolchain packaging docs .github wine/dlls/ntdll wine/dlls/wineios.drv wine/dlls/winevulkan wine/include wine/server wine/tools/winemaker | gzip -1 > /tmp/juice-source/integrated.tar.gz
          test "$(du -sm /tmp/juice-source | cut -f1)" -lt 100
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-integrated-code
          path: /tmp/juice-source/*.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
