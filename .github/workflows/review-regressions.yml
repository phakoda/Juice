name: Reconcile reviewed integration

on:
  push:
    branches: [chatgpt/review-validation-2026-09-06]

permissions:
  contents: read

jobs:
  integrate-reviewed-main:
    if: github.repository == 'phakoda/Juice' && github.ref_name == 'chatgpt/review-validation-2026-09-06'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the locally tested merge resolution
        shell: bash
        run: |
          set -euo pipefail
          target=0112534a7bfb6d090c1cded3df0eb6b2b020011f
          git merge-base --is-ancestor "$target" HEAD && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - "$target" <<'PY'
          from pathlib import Path
          import subprocess, sys
          def git(*args):
              return subprocess.check_output(['git',*args])
          def source(ref,path):
              return git('show',ref+':'+path).decode()
          def replace(text,old,new):
              if text.count(old)!=1: raise RuntimeError('Unexpected source context: '+old[:100])
              return text.replace(old,new)
          target=sys.argv[1]
          ours=git('rev-parse','HEAD').decode().strip()
          result=subprocess.run(['git','merge','--no-commit','--no-ff',target])
          if result.returncode not in (0,1) or git('rev-parse','MERGE_HEAD').decode().strip()!=target:
              raise RuntimeError('Merge did not enter the expected state')
          p='app/JuiceAsyncWriter.m';s=source(ours,p)
          s=replace(s,'    if (!socket)\n    {\n        int flags = fcntl(_fd, F_GETFL);\n        if (flags < 0 || fcntl(_fd, F_SETFL, flags | O_NONBLOCK) < 0) return nil;\n    }\n#ifdef SO_NOSIGPIPE\n    else',
          '''    int flags = fcntl(_fd, F_GETFL);
              if (flags < 0 || fcntl(_fd, F_SETFL, flags | O_NONBLOCK) < 0) return nil;
          #ifdef SO_NOSIGPIPE
              if (socket)''')
          Path(p).write_text(s)
          p='app/JuiceDisplayTransportHardening.m';s=source(ours,p)
          s=replace(s,'#import <signal.h>','#import <signal.h>\n#import <poll.h>')
          s=replace(s,'        if(count<0&&errno==EINTR)continue;\n        if(count<=0)return NO;',
          '''        if(count<0&&errno==EINTR)continue;
                  if(count<0&&(errno==EAGAIN||errno==EWOULDBLOCK))
                  {
                      /* The writer shares O_NONBLOCK with this descriptor. */
                      struct pollfd event={.fd=fd,.events=POLLIN};
                      int ready;do{ready=poll(&event,1,-1);}while(ready<0&&errno==EINTR);
                      if(ready<0||(event.revents&POLLNVAL))return NO;
                      continue;
                  }
                  if(count<=0)return NO;''')
          Path(p).write_text(s)
          p='app/JuiceLaunchHardening.m';s=source(target,p)
          s=replace(s,'    if(!line.length)return @[];',
          '''    if(!line.length)return @[];
              for(NSUInteger i=0;i<line.length;i++)if([line characterAtIndex:i]==0)
              {if(failure)*failure=@"Arguments cannot contain a NUL character.";return nil;}''')
          Path(p).write_text(s)
          p='app/JuiceSocketIO.h';s=Path(p).read_text()
          s=replace(s,'/* Socket-only exact I/O. MSG_DONTWAIT avoids changing the shared descriptor\'s\n * file status flags. A single monotonic deadline includes all short transfers,',
          '''/* Socket-only exact I/O. The caller must set O_NONBLOCK and coordinate that
           * shared file status with other readers. A single deadline includes transfers,''')
          s=replace(s,'#include <errno.h>','#include <errno.h>\n#include <fcntl.h>')
          s=replace(s,'    while (length)\n    {',
          '''    int descriptor_flags = fcntl(fd, F_GETFL);
              if (descriptor_flags < 0) return 0;
              if (!(descriptor_flags & O_NONBLOCK)) { errno = EINVAL; return 0; }
              while (length)
              {''')
          Path(p).write_text(s)
          p='app/JuiceHostIOHardening.m';s=Path(p).read_text()
          s=replace(s,'    (void)_cmd;struct juice_control_message message;\n',
          '''    (void)_cmd;struct juice_control_message message;
              /* This request owns fd until its response, so the flag change is local. */
              int descriptor_flags=fcntl(fd,F_GETFL);
              if(descriptor_flags<0||fcntl(fd,F_SETFL,descriptor_flags|O_NONBLOCK)<0)
              {close(fd);return;}
          ''')
          Path(p).write_text(s)
          p='app/tests/SocketIOTests.c';s=Path(p).read_text()
          s=replace(s,'static void pair(int sockets[2]) { assert(socketpair(AF_UNIX, SOCK_STREAM, 0, sockets) == 0); }',
          '''static void pair(int sockets[2])
          {
              assert(socketpair(AF_UNIX, SOCK_STREAM, 0, sockets) == 0);
              for(int i=0;i<2;i++)
              {
                  int flags=fcntl(sockets[i],F_GETFL);assert(flags>=0);
                  assert(fcntl(sockets[i],F_SETFL,flags|O_NONBLOCK)==0);
              }
          }''')
          s=replace(s,'    puts("PASS zero length and invalid arguments");',
          '''    assert(socketpair(AF_UNIX,SOCK_STREAM,0,sockets)==0);
              assert(!JuiceSocketTransferUntil(sockets[0],buffer,1,0,JuiceSocketNowMS()+100));
              assert(errno==EINVAL);done(sockets);
              puts("PASS zero length, invalid arguments and blocking-descriptor rejection");''')
          Path(p).write_text(s)
          for p in ['.github/workflows/source-checks.yml','.github/workflows/review-regressions.yml']:
              Path(p).write_text(source(ours,p))
          subprocess.run(['git','add','app','scripts','.github/workflows'],check=True)
          if git('diff','--name-only','--diff-filter=U').strip(): raise RuntimeError('Unresolved merge paths')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('JUICE_REVIEW_MERGE_OK')
          PY
          git commit -m 'merge: preserve validated mainline while integrating resource and protocol review fixes'
          git push origin HEAD:refs/heads/chatgpt/review-validation-2026-09-06
