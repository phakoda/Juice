name: Review regressions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked review inputs
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/juice-review-inputs.tar.gz" HEAD \
            app launcher scripts config patches .github Makefile README.md \
            wine/dlls/wineios.drv wine/dlls/ntdll
      - uses: actions/upload-artifact@v4
        with:
          name: juice-review-inputs
          path: ${{ runner.temp }}/juice-review-inputs.tar.gz
          retention-days: 1
          if-no-files-found: error
