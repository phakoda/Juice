name: Graphics API source snapshot
on:
  pull_request:
    paths:
      - 'config/graphics-api-modules.txt'
      - 'config/runtime-modules.txt'
      - 'scripts/verify_graphics_api.py'
      - '.github/workflows/graphics-api-source-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact source revision
        run: git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Preserve audited declarations for offline review
        uses: actions/upload-artifact@v4
        with:
          name: graphics-api-source-${{ github.sha }}
          path: |
            SOURCE_COMMIT.txt
            config/graphics-api-modules.txt
            config/runtime-modules.txt
            wine/dlls/*/Makefile.in
            wine/dlls/*/*.spec
          retention-days: 7
          if-no-files-found: error
