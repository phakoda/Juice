name: Compatibility bring-up
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-bringup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/test-compatibility-bringup-host.sh
  iphoneos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/test-compatibility-bringup-host.sh
      - run: make app
      - run: make launchers
