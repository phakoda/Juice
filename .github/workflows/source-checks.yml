name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source tree and Wine patch
        run: make verify
      - name: Verify StikDebug JIT integration
        run: bash scripts/verify-stikdebug-jit.sh

  app-build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Juice for iPhoneOS
        run: make app
      - name: Compile launcher helpers for iPhoneOS
        run: make launchers
