name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source tree and Wine patch
        run: make verify
      - name: Verify StikDebug JIT integration
        run: bash scripts/verify-stikdebug-jit.sh

  app-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Juice for iPhoneOS
        run: make app
      - name: Compile launcher helpers for iPhoneOS
        run: make launchers
      - name: Run ZIP extractor regressions
        run: bash scripts/test-zip-extractor-host.sh

  review-inputs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked review inputs
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/juice-review-inputs.tar.gz" HEAD \
            app launcher scripts config patches .github Makefile README.md \
            wine/dlls/wineios.drv wine/dlls/ntdll
      - uses: actions/upload-artifact@v4
        with:
          name: juice-review-inputs
          path: ${{ runner.temp }}/juice-review-inputs.tar.gz
          retention-days: 1
          if-no-files-found: error
